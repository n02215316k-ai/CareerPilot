services:
  careerpilot-cv-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot-cv-builder
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - proxy
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  careerpilot-jobs-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot-jobs-worker
    restart: unless-stopped
    command: ["node", "worker/job-sync.mjs"]
    env_file:
      - .env
    environment:
      JOB_SYNC_INTERVAL_MINUTES: "10"
      VACANCYMAIL_MAX_PAGES: "12"
      JOBSZIMBABWE_MAX_PAGES: "10"
      NGOJOBSINAFRICA_MAX_PAGES: "3"
    networks:
      - backend

networks:
  proxy:
    external: true
  backend:
    external: true
