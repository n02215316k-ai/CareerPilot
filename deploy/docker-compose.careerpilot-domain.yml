services:
  careerpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "80"
      HOSTNAME: "0.0.0.0"
    expose:
      - "80"
    networks:
      - proxy
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  proxy:
    external: true
  backend:
    external: true
